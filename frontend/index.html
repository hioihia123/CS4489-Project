<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="CS4389: Database Security login page">
  <title>CS4389: Database Security | Sign in</title>
  <link rel="stylesheet" href="login.css">
  <script src="login.js" defer></script>
</head>
<body>
  <button class="theme-toggle" type="button" id="themeToggle" aria-label="Switch to dark mode" title="Toggle theme">
    <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.6 8.6 0 1 0 20.2 15.1Z" />
    </svg>
    <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
    </svg>
  </button>

  <main class="page-shell">
    <section class="login-card" aria-labelledby="pageTitle">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none">
          <ellipse cx="20" cy="10" rx="11" ry="5" stroke="currentColor" stroke-width="2.3" />
          <path d="M9 10v17c0 2.8 4.9 5.2 11 5.2S31 29.8 31 27V10" stroke="currentColor" stroke-width="2.3" />
          <path d="M9 18.5c0 2.8 4.9 5.2 11 5.2S31 21.3 31 18.5" stroke="currentColor" stroke-width="2.3" />
        </svg>
      </div>

      <header class="card-header">
        <h1 id="pageTitle">CS4389: Database Security</h1>
        <p>Sign in to your account</p>
      </header>

      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="username">Username</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="3.5" />
              <path d="M5 20v-1.2a7 7 0 0 1 14 0V20" />
            </svg>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="Enter your username" required minlength="1" autofocus>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="5.5" y="10.5" width="13" height="10" rx="2" />
              <path d="M8.5 10.5V7a3.5 3.5 0 0 1 7 0v3.5" />
            </svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button class="password-toggle" type="button" id="passwordToggle" aria-label="Show password" aria-pressed="false">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
                <circle cx="12" cy="12" r="2.5" />
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m3 3 18 18M9.4 5.4A11.5 11.5 0 0 1 12 5c6 0 9.5 7 9.5 7a14.7 14.7 0 0 1-3.7 4.1M6.2 7.2C3.6 9 2.5 12 2.5 12s3.5 7 9.5 7a9.2 9.2 0 0 0 3.5-.7" />
              </svg>
            </button>
          </div>
        </div>

        <button class="submit-button" id="submitButton" type="submit">
          <span>Sign in</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14m-6-6 6 6-6 6" />
          </svg>
        </button>
        <p class="form-status" id="formStatus" role="status" aria-live="polite" hidden></p>
      </form>
    </section>
  </main>
</body>
</html>
