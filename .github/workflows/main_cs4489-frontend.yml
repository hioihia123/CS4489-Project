# Azure vulnerable frontend deployment. README/docs-only pushes are excluded.
name: Build and deploy Node.js app to Azure Web App - cs4489-frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '!frontend/**/*.md'
      - '!frontend/**/*.MD'
  workflow_dispatch:

concurrency:
  group: cs4489-vulnerable-frontend-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        working-directory: frontend
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: frontend/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C7196718A79545189F055EE3005FC0AB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_32DB80D431004D3B8ECE5B5934FD2B99 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F29419736FDD4837A49165A9EFD9ECBC }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: cs4489-frontend
          slot-name: Production
          package: .
