name: Deploy vulnerable FastAPI backend to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: backend-vulnerable
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deploy vulnerable backend to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: cs4489-undefended-v1
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend-vulnerable
