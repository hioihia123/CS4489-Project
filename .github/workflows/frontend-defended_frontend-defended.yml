name: Deploy Defended Frontend

on:
  push:
    branches:
      - frontend-defended

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify frontend files
        run: |
          test -f frontend-defended/index.html
          test -f frontend-defended/login.css
          test -f frontend-defended/login.js

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3AB73C09E8014E92B3635C4CBE58434B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A28E9AEAA60042C7A0BA537C0D7CAEFF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_29C563E961FF4C7F9220CD180BD3A1CD }}

      - name: Deploy Defended Frontend
        uses: azure/webapps-deploy@v3
        with:
          app-name: frontend-defended
          slot-name: Production
          package: ./frontend-defended
