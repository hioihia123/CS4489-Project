
name: Deploy Defended CS4489 Application

on:
  push:
    branches:
      - frontend-defended

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cs4489-defended-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Download source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. Verify required files
      - name: Verify project structure
        run: |
          test -f backend-defended/main.py
          test -f backend-defended/auth.py
          test -f backend-defended/db.py
          test -f backend-defended/requirements.txt
          test -f frontend-defended/index.html
          test -f frontend-defended/login.js
          test -f frontend-defended/dashboard.html
          test -f frontend-defended/dashboard.js

      # 4. Validate backend dependencies and syntax
      - name: Validate Python backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend-defended/requirements.txt
          python -m compileall -q backend-defended

      # 5. Copy current frontend into FastAPI site folder
      - name: Prepare combined deployment
        run: |
          mkdir -p backend-defended/site
          cp frontend-defended/index.html \
             frontend-defended/login.css \
             frontend-defended/login.js \
             frontend-defended/dashboard.html \
             frontend-defended/dashboard.css \
             frontend-defended/dashboard.js \
             backend-defended/site/

      # 6. Authenticate using Azure OpenID Connect 
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EC20A961FDD84837A12AF76599DCCB4F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3B174FDEECBA4B0C9560B275B8EB185D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_22429BB038AB4CA6969AF4785A6A354D }}


      # 7. Deploy only the defended application
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: cs4489-defended-v1
          package: ./backend-defended

      # 8. Verify the deployed backend
      - name: Check deployed application
        run: |
          curl --fail --retry 6 \
            --retry-delay 10 \
            --retry-all-errors \
            https://cs4489-defended-v1.azurewebsites.net/health
